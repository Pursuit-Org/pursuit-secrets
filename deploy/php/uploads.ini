; Leave headroom above PrivateBin's 50 MB encrypted-payload limit for JSON
; metadata and request parsing while staying within Render Starter's 512 MB.
post_max_size = 64M
upload_max_filesize = 64M
memory_limit = 256M

; PHP's October 23 advisory recommends disabling this unused session feature,
; including on patched runtimes. PrivateBin attachments use encrypted JSON.
session.upload_progress.enabled = 0
